# 🔴 F-11 M3|clamd 硬化設定。
#
# 這份檔案存在的主要理由是 AlertExceedsMax —— 見下方。其餘為資源與攻擊面收斂。
# 對照 clamd.conf.sample(Cisco-Talos/clamav)撰寫,不是憑印象填。

LogTime yes
LogClean no
Foreground yes

# INSTREAM 監聽:API 與 clamd 不同容器,走 TCP
TCPSocket 3310
TCPAddr 0.0.0.0

# 🔴 同時保留 unix socket —— **不是給 API 用的,是給 healthcheck 用的**。
# 映像自帶的 `clamdcheck.sh` 只走 LocalSocket;只開 TCP 的話它永遠回
# `ERROR: Unable to contact server`,健康檢查卡在 starting 直到編排器判定失敗。
# (實測:FailingStreak 一路累積,容器其實是好的。)
LocalSocket /tmp/clamd.sock
# 666 而非 660:socket 位於容器內的 tmpfs、不對外掛載,
# 而 healthcheck 以降權後的 clamav 身分執行 —— 660 + root:root 會讓它讀不到
# (實測:socket 明明存在、TCP 也回 PONG,健康檢查卻一直 Unable to contact server)。
LocalSocketMode 666

# 🔴 最危險的預設值。
#
# clamd 對「超過大小 / 遞迴 / 檔數上限」的檔案,預設是**跳過不掃並回報 OK**
# (AlertExceedsMax 預設 no)。也就是說 archive bomb 不但沒被擋,還會拿到
# 「乾淨」的結果 —— 這是最糟的組合:有掃、有紀錄、而且是錯的。
#
# 開成 yes 後超限會回 Heuristics.Limits.Exceeded,應用端據此標 scan_error
# (不可下載),而不是 clean。
AlertExceedsMax yes

# 上限收緊到與平台的上傳上限(20MB)同量級。
# 預設值(MaxFileSize 100M / MaxScanSize 400M)遠大於我們會收到的檔案,
# 留著只是白白擴大 clamd 的處理面積 —— 而 clamd 自己就是攻擊面(見 docker-compose 註解)。
MaxFileSize 25M
MaxScanSize 100M
StreamMaxLength 25M
MaxRecursion 10
MaxFiles 1000
MaxScanTime 60000

# 加密壓縮 / 加密 PDF 視為可疑:掃不進去的東西不該被當成乾淨
AlertEncrypted yes
AlertEncryptedArchive yes
AlertEncryptedDoc no

# Office 巨集(與 content-inspect.ts 的 OOXML 檢查互為冗餘,刻意保留兩道)
AlertOLE2Macros yes

# 掃描器本身的資源護欄
MaxThreads 4
MaxQueue 50
ReadTimeout 60
CommandReadTimeout 30
MaxDirectoryRecursion 10

# reload 期間不讓 RAM 翻倍(代價是 reload 時阻塞掃描;
# 對我們的量體而言,短暫阻塞優於 OOM)
ConcurrentDatabaseReload no
